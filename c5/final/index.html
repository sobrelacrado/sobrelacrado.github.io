<style>
:root{--piscina:#1B7F8E;--coral:#F2685B;--amarillo:#F7C548;--arena:#FFF1E2;--marino:#14213D;--lacre:#B3202A;--papel:#FFF9F1;--rosa:#FBE3D6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--arena);color:var(--marino);font-family:"Josefin Sans","Trebuchet MS",Arial,sans-serif;font-size:17px;line-height:1.4;min-height:100vh}
.cab{background:var(--marino);color:var(--arena);padding:10px 16px 9px;border-bottom:5px solid var(--coral);position:relative}
.cab::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:4px;background:var(--amarillo)}
.cab .t1{font-family:"Bowlby One",Impact,"Arial Black",sans-serif;font-size:15px;letter-spacing:.3px;line-height:1.15}
.cab .t1 span{color:var(--amarillo)}
main{max-width:560px;margin:0 auto;padding:26px 16px 36px}
h1{font-family:"Bowlby One",Impact,"Arial Black",sans-serif;font-weight:400;font-size:26px;line-height:1.1;margin:4px 0 8px}
.tag{font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:var(--piscina);font-weight:700}
.rec{background:var(--papel);border:3px solid var(--marino);border-radius:16px;padding:18px 14px 16px;margin:18px 0 14px;text-align:center}
.rec .ley{font-size:15px;margin:0 0 14px;color:#3b4660}
.rec .tit{font-family:"Bowlby One",Impact,sans-serif;font-size:20px;letter-spacing:1px;margin:0 0 12px}
.pares{display:flex;justify-content:center;gap:10px;margin:0 0 16px}
.placa{display:flex;gap:4px;padding:8px;border-radius:12px;background:linear-gradient(145deg,#E7C46A,#B88A2E);border:3px solid #7A5A14;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.placa input{width:40px;height:56px;border:2px solid #7A5A14;border-radius:8px;background:#FFF6D8;color:var(--marino);font:700 28px "Josefin Sans",Arial,sans-serif;text-align:center;text-transform:uppercase;padding:0;caret-color:var(--coral);-webkit-appearance:none;appearance:none}
.placa input:focus{outline:4px solid var(--coral);outline-offset:1px}
@media (max-width:370px){.placa input{width:34px}.pares{gap:6px}}
.btn{display:block;width:100%;min-height:56px;border:3px solid var(--marino);border-radius:14px;background:var(--amarillo);color:var(--marino);font:700 19px/1.15 "Josefin Sans",Arial,sans-serif;padding:10px 14px;cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.55}
.msg{min-height:26px;margin:12px 0 0;font-weight:700;color:var(--marino)}
.rec.mal{animation:sac .4s}
@keyframes sac{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.rec.mal{animation:none}}
.nota{font-size:14px;color:#3b4660;border-top:2px dashed var(--piscina);margin-top:20px;padding-top:12px}

/* --- final --- */
body.abierto{background:var(--rosa)}
.sello{width:64px;height:64px;border-radius:50%;margin:0 auto 14px;background:radial-gradient(circle at 35% 30%,#d8434c,var(--lacre) 60%,#7e141c);color:#ffd9d9;font-family:Georgia,serif;font-weight:700;font-size:26px;line-height:58px;text-align:center;letter-spacing:1px;border:2px solid #8c1720}
.relato{text-align:left}
.relato h1{text-align:center;font-size:30px;margin-bottom:4px}
.relato .sub{text-align:center;color:var(--piscina);font-weight:700;margin:0 0 22px;letter-spacing:.3px}
.relato p{font-family:"Delicious Handrawn","Josefin Sans",cursive;font-size:23px;line-height:1.42;margin:0 0 16px;opacity:0;transform:translateY(8px);animation:ap .7s ease forwards}
.relato blockquote{margin:22px 0;padding:14px 16px;border-left:8px solid var(--coral);background:var(--papel);border-radius:6px 14px 14px 6px;font-family:"Delicious Handrawn","Josefin Sans",cursive;font-size:25px;line-height:1.35;opacity:0;animation:ap .9s ease forwards}
.relato .fin{text-align:center;font-family:"Bowlby One",Impact,sans-serif;font-size:22px;letter-spacing:3px;margin:26px 0}
.relato .pie{font-family:"Josefin Sans",Arial,sans-serif;font-size:15px;font-style:italic;color:#3b4660;border-top:2px dashed var(--piscina);padding-top:14px;opacity:0;animation:ap .8s ease forwards}
@keyframes ap{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.relato p,.relato blockquote,.relato .pie{animation-duration:.01s;animation-delay:0s!important}}
</style>

    for(i=0;i<16;i++)s[i]=SB[s[i]];
    // ShiftRows
    n[0]=s[0];n[1]=s[5];n[2]=s[10];n[3]=s[15];n[4]=s[4];n[5]=s[9];n[6]=s[14];n[7]=s[3];
    n[8]=s[8];n[9]=s[13];n[10]=s[2];n[11]=s[7];n[12]=s[12];n[13]=s[1];n[14]=s[6];n[15]=s[11];
    if(r<14){
      for(i=0;i<16;i+=4){
        var a0=n[i],a1=n[i+1],a2=n[i+2],a3=n[i+3];
        s[i]=xt(a0)^(xt(a1)^a1)^a2^a3;
        s[i+1]=a0^xt(a1)^(xt(a2)^a2)^a3;
        s[i+2]=a0^a1^xt(a2)^(xt(a3)^a3);
        s[i+3]=(xt(a0)^a0)^a1^a2^xt(a3);
      }
    }else s.set(n);
    for(i=0;i<16;i++)s[i]^=w[r*16+i];
  }
  return s;
}
function ctrJS(key,iv,data){ // AES-GCM = CTR desde contador 2; la etiqueta se ignora aqui
  var w=expand(key),out=new Uint8Array(data.length),cb=new Uint8Array(16),n=2,i,j,ks;
  cb.set(iv);
  for(i=0;i<data.length;i+=16){
    cb[12]=(n>>>24)&255;cb[13]=(n>>>16)&255;cb[14]=(n>>>8)&255;cb[15]=n&255;n++;
    ks=encBlock(w,cb);
    for(j=0;j<16&&i+j<data.length;j++)out[i+j]=data[i+j]^ks[j];
  }
  return out;
}
function textoDe(bytes){
  try{return new TextDecoder("utf-8",{fatal:true}).decode(bytes);}
  catch(e){var s="";for(var i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);try{return decodeURIComponent(escape(s));}catch(_){return null;}}
}
/* ---------- descifrado: WebCrypto y, si no existe, Plan B ---------- */
function descifrar(cod){
  var pw=new TextEncoder().encode(cod),salt=b64(SAL),iv=b64(IV),ct=b64(CT);
  var sub=(window.crypto&&window.crypto.subtle)?window.crypto.subtle:null;
  if(sub){
    return sub.importKey("raw",pw,"PBKDF2",false,["deriveKey"]).then(function(km){
      return sub.deriveKey({name:"PBKDF2",salt:salt,iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    }).then(function(k){
      return sub.decrypt({name:"AES-GCM",iv:iv},k,ct);
    }).then(function(buf){return finalizar(textoDe(new Uint8Array(buf)));},function(){return null;});
  }
  return new Promise(function(res){
    setTimeout(function(){
      var key=pbkdf2(pw,salt,ITER);
      res(finalizar(textoDe(ctrJS(key,iv,ct.subarray(0,ct.length-16)))));
    },30);
  });
}
function finalizar(t){
  if(!t||t.indexOf("MIRAMAR\n")!==0)return null;
  try{return JSON.parse(t.slice(8));}catch(e){return null;}
}
window.__final={descifrar:descifrar,norm:norm,_js:function(cod){ // para pruebas: fuerza el Plan B
  var key=pbkdf2(new TextEncoder().encode(cod),b64(SAL),ITER);
  return finalizar(textoDe(ctrJS(key,b64(IV),b64(CT).subarray(0,b64(CT).length-16))));}};

/* ---------- interfaz ---------- */
var pares=document.getElementById("pares"),ins=[],msg=document.getElementById("msg"),rec=document.getElementById("rec"),ir=document.getElementById("ir");
for(var p=0;p<3;p++){
  var d=document.createElement("div");d.className="placa";
  for(var q=0;q<2;q++){
    var inp=document.createElement("input");
    inp.type="text";inp.maxLength=1;inp.autocomplete="off";inp.autocapitalize="characters";inp.setAttribute("autocorrect","off");inp.spellcheck=false;
    inp.inputMode="text";inp.setAttribute("aria-label","Letra "+(p*2+q+1)+" de 6");
    d.appendChild(inp);ins.push(inp);
  }
  pares.appendChild(d);
}
function repartir(txt,desde){
  var s=norm(txt),i;
  for(i=0;i<s.length&&desde+i<6;i++)ins[desde+i].value=s.charAt(i);
  var f=Math.min(desde+s.length,5);ins[f].focus();
}
ins.forEach(function(el,i){
  el.addEventListener("input",function(){
    var s=norm(el.value);
    if(s.length>1){el.value="";repartir(s,i);return;}
    el.value=s;
    if(s&&i<5)ins[i+1].focus();
  });
  el.addEventListener("keydown",function(e){
    if(e.key==="Backspace"&&!el.value&&i>0){ins[i-1].focus();ins[i-1].value="";e.preventDefault();}
    else if(e.key==="ArrowLeft"&&i>0)ins[i-1].focus();
    else if(e.key==="ArrowRight"&&i<5)ins[i+1].focus();
  });
  el.addEventListener("paste",function(e){
    var t=(e.clipboardData||window.clipboardData).getData("text");e.preventDefault();repartir(t,i);
  });
  el.addEventListener("focus",function(){el.select();});
});

/* bloqueo suave tras 5 fallos (2 min) */
var fallos=0,hasta=0;
try{hasta=+localStorage.getItem("mir_h")||0;}catch(e){}
function esperando(){return Date.now()<hasta;}
rec.addEventListener("submit",function(e){
  e.preventDefault();
  if(esperando()){msg.textContent="Espera un par de minutos antes de volver a probar.";return;}
  var cod=ins.map(function(x){return norm(x.value);}).join("");
  if(cod.length<6){msg.textContent="Faltan letras. Son seis.";return;}
  ir.disabled=true;msg.textContent="…";
  descifrar(cod).then(function(o){
    ir.disabled=false;
    if(o){abrir(o);return;}
    fallos++;msg.textContent="Esas letras no abren nada.";
    rec.classList.remove("mal");void rec.offsetWidth;rec.classList.add("mal");
    if(fallos>=5){fallos=0;hasta=Date.now()+120000;try{localStorage.setItem("mir_h",String(hasta));}catch(e){}msg.textContent="Esas letras no abren nada. Espera un par de minutos.";}
  });
});
function abrir(o){
  document.getElementById("entrada").hidden=true;
  document.body.className="abierto";
  var r=document.getElementById("relato");
  var h='<div class="sello">SL</div><h1></h1><p class="sub"></p>',i;
  r.innerHTML=h;
  r.querySelector("h1").textContent=o.t;r.querySelector(".sub").textContent=o.s;
  var cont=document.createElement("div");cont.innerHTML=o.h.join("");
  var n=0;
  Array.prototype.slice.call(cont.children).forEach(function(c){c.style.animationDelay=(0.4+n*0.3)+"s";n++;r.appendChild(c);});
  var pie=document.createElement("p");pie.className="pie";pie.textContent=o.p;pie.style.animationDelay=(0.4+n*0.3+0.3)+"s";r.appendChild(pie);
  r.hidden=false;window.scrollTo(0,0);
}
})();

<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#0b0906">
<title>La caja 14 · Cilindro del Sr. Varela</title>
<style>
html,body{margin:0;height:100%;background:#0b0906;color:#efe6d2;font-family:Georgia,'Times New Roman',serif;overflow:hidden}
.wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
video{max-width:100vw;max-height:100vh;height:100%;aspect-ratio:9/16;background:#000;display:block}
#play{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:14px;padding-bottom:calc(env(safe-area-inset-bottom) + 9vh);background:linear-gradient(#0000 55%,#0b0906e0);border:0;color:#efe6d2;cursor:pointer;font:inherit}
#play .c{width:96px;height:96px;border-radius:50%;border:3px solid #efe6d2;display:flex;align-items:center;justify-content:center}
#play .c::after{content:"";margin-left:8px;border-left:30px solid #efe6d2;border-top:18px solid transparent;border-bottom:18px solid transparent}
#play b{font-size:22px;letter-spacing:3px;text-transform:uppercase}
#play small{font-size:14px;opacity:.75;font-style:italic}
.hide{display:none!important}
</style></head>
<body>
<div class="wrap"><video id="v" src="v2.mp4" poster="poster.jpg" playsinline preload="auto" controls></video></div>
<button id="play" aria-label="Reproducir"><span class="c"></span><small>Active el sonido</small></button>
<script>
var v=document.getElementById('v'), p=document.getElementById('play');
p.onclick=function(){ p.classList.add('hide'); v.play(); };
v.addEventListener('ended',function(){ p.classList.remove('hide'); p.querySelector('small').textContent='Volver a ver'; });
</script>
</body></html>
